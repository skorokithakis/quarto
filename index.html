<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="favicon.svg">
  <title>Quarto</title>
  <script>
    // Resolve the theme before the first paint so a reload never shows the
    // other mode. Auto (the default) follows the system scheme; a stored
    // choice overrides it. The picker button lives in the page; this script
    // owns the state so the resolution can run this early.
    (() => {
      'use strict';

      const STORAGE_THEME = 'quarto.theme';
      const system = window.matchMedia('(prefers-color-scheme: dark)');
      const root = document.documentElement;

      function storedMode() {
        try {
          const value = window.localStorage.getItem(STORAGE_THEME);
          return value === 'light' || value === 'dark' ? value : 'auto';
        } catch {
          return 'auto';
        }
      }

      let mode = storedMode();

      function resolvedTheme() {
        if (mode !== 'auto') return mode;
        return system.matches ? 'dark' : 'light';
      }

      function applyTheme() {
        root.dataset.theme = resolvedTheme();
        root.dataset.themeMode = mode;
      }

      function setMode(next) {
        mode = next;
        try {
          if (mode === 'auto') window.localStorage.removeItem(STORAGE_THEME);
          else window.localStorage.setItem(STORAGE_THEME, mode);
        } catch { /* storage unavailable */ }
        applyTheme();
      }

      function renderThemeLabel() {
        for (const button of document.querySelectorAll('.theme-toggle')) {
          const label = `Theme: ${mode}`;
          button.setAttribute('aria-label', label);
          button.title = label;
        }
      }

      function cycleTheme() {
        setMode(mode === 'auto' ? 'light' : mode === 'light' ? 'dark' : 'auto');
        renderThemeLabel();
      }

      applyTheme();

      system.addEventListener('change', () => {
        if (mode === 'auto') applyTheme();
      });

      document.addEventListener('DOMContentLoaded', () => {
        for (const button of document.querySelectorAll('.theme-toggle')) {
          button.addEventListener('click', cycleTheme);
        }
        renderThemeLabel();
      });
    })();
  </script>
  <style>
    /* Commissioner is served from this page: one variable file per subset. */
    @font-face {
      font-family: "Commissioner";
      font-style: normal;
      font-weight: 400 700;
      font-display: swap;
      src: url("fonts/commissioner-greek.woff2") format("woff2");
      unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;
    }
    @font-face {
      font-family: "Commissioner";
      font-style: normal;
      font-weight: 400 700;
      font-display: swap;
      src: url("fonts/commissioner-latin-ext.woff2") format("woff2");
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    @font-face {
      font-family: "Commissioner";
      font-style: normal;
      font-weight: 400 700;
      font-display: swap;
      src: url("fonts/commissioner-latin.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    :root {
      color-scheme: light;

      /* Surfaces */
      --linen: #F2EDE3;
      --paper: #FAF7F0;
      --sunk: #E8E1D3;
      --line: #D8CFBF;
      --line-strong: #B5A990;

      /* Board */
      --board: #B9A688;
      --board-wall: #9C8968;
      --cell: #AC9878;
      --cell-hover: #BBA98B;
      --winning-cell: #EBE1CD;

      /* Text */
      --charcoal: #2B2622;
      --muted: #6B6156;
      --disabled: #7A7064;

      /* Accent */
      --indigo: #34507A;
      --indigo-hover: #3E5D8C;
      --indigo-wall: #22385A;
      --on-indigo: #FFFFFF;

      /* Strong button */
      --block: #3A332D;
      --block-hover: #4A423B;
      --block-wall: #1C1814;

      /* Light piece */
      --light-face: #F4E9D2;
      --light-wall: #D4C09B;
      --light-recess: #A68C63;
      --light-outline: #8C7653;

      /* Dark piece */
      --dark-face: #5C4232;
      --dark-wall: #3D2B20;
      --dark-recess: #1D130D;
      --dark-outline: #261A12;
      --dark-lip: #9A7A62;

      /* Control surfaces from the control-states sheet */
      --control-line: #CFC4B0;
      --disabled-surface: #E6DFD2;
      --button-hover: #FFFFFF;

      /* Type */
      --font-family: Commissioner, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --type-wordmark: 600 40px/44px var(--font-family);
      --type-title: 600 22px/28px var(--font-family);
      --type-quarto-button: 700 18px/20px var(--font-family);
      --type-status: 600 16px/22px var(--font-family);
      --type-body: 400 15px/22px var(--font-family);
      --type-body-strong: 600 15px/20px var(--font-family);
      --type-label: 600 12px/16px var(--font-family);

      /* Spacing */
      --space-4: 4px;
      --space-8: 8px;
      --space-12: 12px;
      --space-16: 16px;
      --space-24: 24px;
      --space-32: 32px;
      --space-48: 48px;

      /* Corner radius */
      --radius-pool: 8px;
      --radius-cell: 10px;
      --radius-small-button: 10px;
      --radius-large-button: 12px;
      --radius-chip: 12px;
      --radius-card: 14px;
      --radius-board: 18px;

      /* Depth: a pressed part moves down and leaves a 1px edge. */
      --edge-button: 3px;
      --edge-strong: 4px;
      --edge-quarto: 5px;
      --edge-board: 5px;
      --press-button: 2px;
      --press-strong: 3px;
      --press-quarto: 4px;

      --control-transition: transform 120ms ease, box-shadow 120ms ease,
        background-color 120ms ease, opacity 120ms ease;
    }

    /* Dark mode swaps the UI colours only; type, spacing and piece colours
       keep their light values. Values come from the dark palette frame. */
    :root[data-theme="dark"] {
      color-scheme: dark;

      /* Surfaces */
      --linen: #1C1916;
      --paper: #27231F;
      --sunk: #141210;
      --line: #3B352E;
      --line-strong: #5E554A;

      /* Board */
      --board: #A39072;
      --board-wall: #7B6A4F;
      --cell: #968366;
      --cell-hover: #A89574;
      --winning-cell: #D6C7A8;

      /* Text */
      --charcoal: #EDE6DA;
      --muted: #A89D8E;
      --disabled: #857B6E;

      /* Accent */
      --indigo: #8DA6D6;
      --indigo-hover: #A4B9E2;
      --indigo-wall: #566F9E;
      --on-indigo: #121A2B;

      /* Strong button */
      --block: #E2D9CA;
      --block-hover: #EEE7DB;
      --block-wall: #A4977F;

      /* Control surfaces */
      --control-line: #4D463D;
      --disabled-surface: #2B2723;
      /* The design has no dark hover; this is one step above --paper,
         as #FFFFFF is in light mode. */
      --button-hover: #312C27;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--linen);
      color: var(--charcoal);
      font: var(--type-body);
      font-family: var(--font-family);
      -webkit-font-smoothing: antialiased;
    }

    button, input, textarea { font-family: inherit; }

    h1, h2, p { margin: 0; }

    .screen {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 var(--space-32) 80px;
    }

    .screen-column {
      width: 100%;
      max-width: 326px;
      display: flex;
      flex-direction: column;
      gap: var(--space-24);
    }

    .heading {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .wordmark {
      font: var(--type-wordmark);
      letter-spacing: -0.01em;
      text-wrap: balance;
    }

    .title {
      font: var(--type-title);
      text-wrap: balance;
    }

    .muted {
      color: var(--muted);
      font: var(--type-body);
      text-wrap: pretty;
    }

    /* ── Piece drawing ─────────────────────────────────────────────────── */

    .brand-pieces {
      display: flex;
      gap: 2px;
      margin-left: -12px;
    }
    .brand-pieces svg { display: block; flex: none; }

    .piece {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }
    .piece svg { display: block; max-width: 100%; max-height: 100%; }

    /* ── Controls ──────────────────────────────────────────────────────── */

    .button-quarto,
    .button-strong,
    .button,
    .button-quiet {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      white-space: nowrap;
      cursor: pointer;
      transition: var(--control-transition);
    }

    .button-quarto:focus-visible,
    .button-strong:focus-visible,
    .button:focus-visible,
    .button-quiet:focus-visible {
      outline: 2px solid var(--indigo);
      outline-offset: 3px;
    }

    .button-quarto {
      width: 100%;
      height: 52px;
      padding: 0 var(--space-8);
      margin: 0 0 var(--edge-quarto);
      border-radius: var(--radius-large-button);
      background: var(--indigo);
      color: var(--on-indigo);
      font: var(--type-quarto-button);
      letter-spacing: 0.02em;
      box-shadow: 0 var(--edge-quarto) 0 var(--indigo-wall);
    }
    .button-quarto:hover { background: var(--indigo-hover); }
    .button-quarto:active {
      transform: translateY(var(--press-quarto));
      box-shadow: 0 1px 0 var(--indigo-wall);
    }
    .button-quarto:disabled {
      background: var(--disabled-surface);
      color: var(--disabled);
      box-shadow: none;
      transform: translateY(var(--edge-quarto));
      cursor: not-allowed;
    }

    .button-strong {
      width: 100%;
      height: 48px;
      padding: 0 var(--space-8);
      margin: 0 0 var(--edge-strong);
      border-radius: var(--radius-large-button);
      background: var(--block);
      color: var(--linen);
      font: 600 16px/20px var(--font-family);
      letter-spacing: 0;
      box-shadow: 0 var(--edge-strong) 0 var(--block-wall);
    }
    .button-strong:hover { background: var(--block-hover); }
    .button-strong:active {
      transform: translateY(var(--press-strong));
      box-shadow: 0 1px 0 var(--block-wall);
    }
    .button-strong:disabled {
      background: var(--disabled-surface);
      color: var(--disabled);
      box-shadow: none;
      transform: translateY(var(--edge-strong));
      cursor: not-allowed;
    }

    .button {
      height: 44px;
      padding: 0 var(--space-8);
      margin: 0 0 var(--edge-button);
      border: 1px solid var(--control-line);
      border-radius: var(--radius-small-button);
      background: var(--paper);
      color: var(--charcoal);
      font: var(--type-body-strong);
      box-shadow: 0 var(--edge-button) 0 var(--control-line);
    }
    .button:hover { background: var(--button-hover); }
    .button:active {
      transform: translateY(var(--press-button));
      box-shadow: 0 1px 0 var(--control-line);
    }
    .button:disabled {
      border: 0;
      background: var(--disabled-surface);
      color: var(--disabled);
      box-shadow: none;
      transform: translateY(var(--edge-button));
      cursor: not-allowed;
    }

    .button-quiet {
      height: 44px;
      padding: 0 var(--space-8);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-small-button);
      background: transparent;
      color: var(--charcoal);
      font: 500 15px/20px var(--font-family);
      box-shadow: none;
    }
    .button-quiet:hover { background: var(--paper); }
    .button-quiet:active { background: var(--sunk); }
    .button-quiet:disabled {
      border-color: var(--line);
      background: transparent;
      color: var(--disabled);
      cursor: not-allowed;
    }

    .chip-pencil {
      flex: none;
      width: 16px;
      height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
    }
    .chip-pencil svg { display: block; }

    .chip-edit {
      appearance: none;
      font: inherit;
      color: inherit;
      text-align: left;
      cursor: pointer;
      transition: var(--control-transition);
    }
    .chip-edit:hover .chip-pencil { color: var(--charcoal); }
    .chip-edit:focus-visible {
      outline: 2px solid var(--indigo);
      outline-offset: 3px;
    }
    .chip-edit:disabled {
      cursor: not-allowed;
    }
    .chip-edit:disabled .chip-pencil {
      color: var(--disabled);
      opacity: 0.4;
    }

    .seat-edit {
      appearance: none;
      width: 100%;
      font: inherit;
      color: var(--charcoal);
      text-align: left;
      cursor: pointer;
      transition: var(--control-transition);
    }
    .seat-edit:hover .chip-pencil { color: var(--charcoal); }
    .seat-edit:focus-visible {
      outline: 2px solid var(--indigo);
      outline-offset: 3px;
    }
    .seat-edit:disabled {
      color: var(--charcoal);
      cursor: not-allowed;
    }
    .seat-edit:disabled .chip-pencil {
      color: var(--disabled);
      opacity: 0.4;
    }

    .prompt-actions {
      display: flex;
      flex-direction: column;
      gap: var(--space-8);
    }
    .prompt-actions .button-quiet { width: 100%; }

    .link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      padding: 0 var(--space-8);
      color: var(--charcoal);
      font: 500 15px/20px var(--font-family);
      text-decoration: underline;
      text-decoration-color: var(--line-strong);
      text-underline-offset: 4px;
      transition: var(--control-transition);
    }
    .link:hover { text-decoration-color: var(--charcoal); }
    .link:active { text-decoration-color: var(--charcoal); opacity: 0.7; }
    .link:focus-visible {
      outline: 2px solid var(--indigo);
      outline-offset: -2px;
      border-radius: var(--radius-small-button);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field label {
      font: 600 13px/18px var(--font-family);
      color: var(--charcoal);
    }
    .field input,
    .field textarea {
      display: block;
      width: 100%;
      min-width: 0;
      height: 48px;
      padding: 0 14px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-small-button);
      background: var(--paper);
      box-shadow: inset 0 1px 2px rgba(43, 30, 18, 0.14);
      color: var(--charcoal);
      font: 400 16px/22px var(--font-family);
      transition: var(--control-transition);
    }
    .field textarea {
      height: 66px;
      padding: 10px 14px;
      resize: none;
      overflow-wrap: anywhere;
      word-break: break-all;
      font: 400 15px/22px var(--font-family);
    }
    .field input:hover,
    .field textarea:hover { border-color: var(--charcoal); }
    .field input:focus,
    .field textarea:focus {
      border-color: var(--indigo);
      outline: 2px solid var(--indigo);
      outline-offset: 2px;
    }
    .field input:disabled,
    .field textarea:disabled {
      border-color: var(--line);
      background: var(--disabled-surface);
      color: var(--disabled);
      box-shadow: none;
    }

    .button-row { display: flex; }
    .actions { display: flex; flex-direction: column; gap: var(--space-8); }
    .error { color: var(--charcoal); font: var(--type-body); }

    /* ── Theme toggle ──────────────────────────────────────────────────── */

    /* Sits in the page corner on the lobby and moves into the room line on
       room screens, so it always shares that row's inset. */
    .theme-toggle {
      position: absolute;
      top: 8px;
      right: var(--space-16);
      appearance: none;
      flex: none;
      width: 44px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: var(--radius-small-button);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: var(--control-transition);
    }
    .theme-toggle:hover { color: var(--charcoal); }
    .theme-toggle:active { color: var(--charcoal); opacity: 0.7; }
    .theme-toggle:focus-visible {
      outline: 2px solid var(--indigo);
      outline-offset: -4px;
      border-radius: var(--radius-small-button);
    }
    .room-line .theme-toggle { position: static; }

    .theme-toggle svg { display: none; }
    :root[data-theme-mode="light"] .theme-toggle .theme-icon-light,
    :root[data-theme-mode="dark"] .theme-toggle .theme-icon-dark { display: block; }
    :root:not([data-theme-mode="light"]):not([data-theme-mode="dark"]) .theme-toggle .theme-icon-auto {
      display: block;
    }

    /* ── Room line ─────────────────────────────────────────────────────── */

    #room {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 0 var(--space-16) 80px;
    }

    .room-line {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-12);
      height: 44px;
    }

    .lobby-link {
      display: flex;
      align-items: center;
      gap: 2px;
      height: 44px;
      padding: 0 12px 0 0;
      color: var(--muted);
      font: 500 13px/18px var(--font-family);
      text-decoration: none;
      transition: var(--control-transition);
    }
    .lobby-link:hover { color: var(--charcoal); }
    .lobby-link:active { color: var(--charcoal); opacity: 0.7; }
    .lobby-link:focus-visible {
      outline: 2px solid var(--indigo);
      outline-offset: -4px;
      border-radius: var(--radius-small-button);
    }

    .lobby-wordmark {
      display: none;
      align-items: center;
      height: 44px;
      color: var(--charcoal);
      font: 600 20px/28px var(--font-family);
      letter-spacing: 0.01em;
      text-decoration: none;
      transition: var(--control-transition);
    }
    .lobby-wordmark:focus-visible {
      outline: 2px solid var(--indigo);
      outline-offset: 3px;
      border-radius: var(--radius-small-button);
    }

    .room-meta {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-left: auto;
      color: var(--muted);
      font: 500 13px/18px var(--font-family);
    }
    .room-name { white-space: nowrap; }
    .room-code {
      font-weight: 600;
      color: var(--charcoal);
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font: 500 13px/18px var(--font-family);
      white-space: nowrap;
    }
    .status-dot {
      flex: none;
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .status[data-state="connecting"] .status-dot,
    .status[data-state="reconnecting"] .status-dot {
      background: transparent;
      box-shadow: inset 0 0 0 1.5px var(--muted);
    }
    .status[data-state="connected"] .status-dot { background: var(--muted); }
    .status[data-state="reconnecting"] { color: var(--charcoal); }

    .room-body {
      flex: 1 1 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 var(--space-16);
    }

    /* ── Waiting room ──────────────────────────────────────────────────── */

    .seats {
      display: flex;
      flex-direction: column;
      gap: var(--space-8);
    }
    .seat {
      min-width: 0;
      height: 44px;
      display: flex;
      align-items: center;
      gap: var(--space-8);
      padding: 0 12px;
      border: 1px solid var(--control-line);
      border-radius: var(--radius-chip);
      background: var(--paper);
    }
    .seat-dot {
      flex: none;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--charcoal);
      box-shadow: inset 0 0 0 1.5px var(--charcoal);
    }
    .seat-name {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font: 600 15px/20px var(--font-family);
    }
    .seat-you {
      flex: none;
      color: var(--muted);
      font: var(--type-label);
    }
    .seat.is-empty {
      border: 1px dashed var(--line-strong);
      background: transparent;
      color: var(--muted);
    }
    .seat.is-empty .seat-name { font: 400 15px/20px var(--font-family); }

    .notice { margin: var(--space-16) 0 0; color: var(--muted); font: var(--type-body); }

    /* ── Name prompt ───────────────────────────────────────────────────── */

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 var(--space-32) 80px;
      background: var(--linen);
    }
    .name-card {
      width: 100%;
      max-width: 326px;
      display: flex;
      flex-direction: column;
      gap: var(--space-24);
    }

    /* ── Game screen ───────────────────────────────────────────────────── */

    #room {
      --pool-slot: 44px;
      --pool-piece: 40px;
      --board-piece: 70px;
      --hand-piece: 70px;
      --hand-height: 84px;
    }
    @media (min-width: 600px) and (max-width: 839px) {
      #room { --board-piece: 96px; }
      #room[data-phase="game"] .room-line {
        width: 480px;
        max-width: 480px;
        margin: 0 auto;
      }
    }
    @media (min-width: 840px) {

    .status-skeleton { display: none; flex-direction: column; gap: 10px; }

    .hand-column {

    @media (min-width: 840px) {
      #room[data-phase="game"] { padding: 12px 32px 24px; }
      .game-main {
        flex: 1 1 auto;
        width: 100%;
        max-width: 860px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        grid-template-rows: auto auto;
        grid-template-areas:

      .lower {
        display: grid;
        grid-template-columns: auto 1fr;
        grid-template-areas:

        column-gap: 12px;
        row-gap: 12px;
      }
      .hand-column { display: contents; }
      .pool-block { grid-area: pool; }
      .hand-block { grid-area: hand; }
      .quarto-block { grid-area: quarto; }
      .control-spacer { display: block; }
      .board { padding: 14px; gap: 8px; border-radius: 24px; }

    @media (min-width: 1200px) {
      #room[data-phase="game"] { padding: 16px 48px 32px; }
      .game-main {
        display: flex;
        flex-direction: row;
        gap: 56px;
        justify-content: center;
        align-items: center;
        max-width: none;
      }
      .info, .side { align-self: center; }
      .info { flex: none; width: 280px; gap: 20px; }
      .game.is-skeleton .info { width: 274px; }
      .board-wrap { flex: none; width: 520px; }
      .side { flex: none; width: 278px; display: flex; flex-direction: column; gap: 14px; }
      .lower, .hand-column { display: contents; }

      .pool-block { order: 2; }
      .quarto-block { order: 3; }

    /* A 44px theme toggle next to the full room line needs a little more room
       than the design's row spacing leaves on the smallest phones. From 390px
       up the row fits as designed, even with "Reconnecting". */
    @media (max-width: 389px) {

    @media (min-width: 840px) {
      .screen { padding: 0 var(--space-48) 60px; }
      .overlay { padding: 0 var(--space-48) 60px; }
      #room { padding: 16px var(--space-48) 60px; }
      .room-line { gap: var(--space-16); }
      .room-body { padding: 0; }
      .lobby-link { display: none; }
      .lobby-wordmark { display: flex; }
      .theme-toggle { right: var(--space-48); }
    }
</style>
</head>
<body>
  <main>
    <section id="lobby" class="screen" hidden>
      <button class="theme-toggle" type="button" aria-label="Theme: auto" title="Theme: auto">
        <svg class="theme-icon-auto" aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="8" r="5.5"></circle>

        <svg class="theme-icon-light" aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="8" r="3"></circle>
          <path d="M8 1.5V3M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M12.6 3.4l-1.1 1.1M4.5 11.5l-1.1 1.1"></path>
        </svg>
        <svg class="theme-icon-dark" aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 8.53A6 6 0 1 1 7.47 2 4.67 4.67 0 0 0 14 8.53z"></path>
        </svg>
      </button>
      <div class="screen-column">
        <div class="brand-pieces" id="brandPieces"></div>
        <div class="heading">
          <h1 class="wordmark">Quarto</h1>
          <p class="muted">A board game for two players.</p>
        </div>
        <div class="actions">
          <button id="createGame" class="button-strong" type="button">Create game</button>
          <a id="lastRoomLink" class="link" href="#" hidden></a>
          <p class="error" id="lobbyError" role="alert" hidden></p>
        </div>
      </div>
    </section>

    <section id="room" hidden>
      <div class="room-line">
        <a class="lobby-link" id="leaveRoomPhone" href="./">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 3.5L5.5 8l4.5 4.5"></path>
          </svg>
          Lobby
        </a>
        <a class="lobby-wordmark" id="leaveRoomDesktop" href="./" aria-label="Quarto: back to lobby">Quarto</a>
        <div class="room-meta">
          <span class="room-name">Room <span class="room-code" id="roomCode"></span></span>
          <span class="status" id="connection" data-state="connecting" role="status" aria-live="polite">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="connectionText">Connecting</span>

        </div>
      </div>

      <div class="room-body">
        <section class="waiting" id="waiting" hidden>
          <div class="screen-column">
            <div class="heading">
              <h1 class="title">Waiting for the second player</h1>
              <p class="muted">Send this link to the other player. The game starts when they open it.</p>
            </div>
            <div class="field">
              <label for="shareLink">Link to this game</label>
              <textarea id="shareLink" rows="2" readonly></textarea>
            </div>
            <div class="button-row">
              <button id="copyLink" class="button-strong" type="button">Copy link</button>
            </div>
            <div class="seats">
              <button class="seat is-you seat-edit name-edit" id="waitingEdit" type="button" aria-label="Change your name" disabled>
                <span class="seat-dot" aria-hidden="true"></span>
                <span class="seat-name" id="youSeatName"></span>
                <span class="seat-you">You</span>
                <span class="chip-pencil" aria-hidden="true"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11.2 2.3a1.2 1.2 0 0 1 1.7 0l.8.8a1.2 1.2 0 0 1 0 1.7L5.4 13.1l-3 .8.8-3z"></path><path d="M9.8 3.7l2.5 2.5"></path></svg></span>
              </button>

      </div>

  <script type="module">
    import { isLegalGame } from './game.js';

    (() => {
      'use strict';

      /*
       * Internal interface for the game layer (game.js, added in a later ticket):
       *
       *   window.QuartoOnline.getState()
       *     -> deep copy of the current synced state, or null before the room loads.
       *
       *   window.QuartoOnline.getSeat()
       *     -> 0, 1, or null (null means spectator or not loaded yet).
       *
       *   window.QuartoOnline.submit(state)
       *     -> true if the change was accepted, false if this client is not
       *        seated or no state has loaded yet. Takes the full state object;
       *        `version` and `seats` are owned by this layer and are ignored.
       *        The change is applied locally at once and posted to Gweet.
       *
       *   window.QuartoOnline.onStateChange(callback)
       *     -> unsubscribe function. callback(state, seat) is called immediately
       *        if a state is already loaded, then whenever a state is applied
       *        (initial load, local submit, or a streamed update).
       *
       *   window.QuartoOnline.getConnection()
       *     -> 'connecting', 'connected', or 'reconnecting'.
       *
       *   window.QuartoOnline.onConnectionChange(callback)
       *     -> unsubscribe function. callback(connection) is called immediately
       *        and whenever the connection state changes.
       */

      const GWEET_BASE = 'https://gweet.stavros.io';
      const KEY_PREFIX = 'quarto';
      const ROOM_LENGTH = 8;
      // No I, O, 0 or 1: these are easy to confuse in a shared code.
      const ROOM_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      const MAX_NAME_LENGTH = 32;

      const STORAGE_CLIENT_ID = 'quarto.clientId';
      const STORAGE_LAST_ROOM = 'quarto.lastRoom';
      const STORAGE_STATE_PREFIX = 'quarto.state.';
      const STORAGE_NAME = 'quarto.name';

      const CONNECTION_LABELS = Object.freeze({
        connecting: 'Connecting',
        connected: 'Connected',
        reconnecting: 'Reconnecting',
      });

      const CONNECT_BACKOFF_START = 800;
      const CONNECT_BACKOFF_FACTOR = 1.7;
      const CONNECT_BACKOFF_MAX = 15000;
      const POST_BACKOFF_START = 1000;
      const POST_BACKOFF_MAX = 10000;
      const REQUEST_TIMEOUT = 12000;
      // Gweet sends a keepalive newline every 30 seconds; silence for longer
      // than this means the connection is dead even if the socket still looks
      // open (for example after a network change).
      const STREAM_IDLE_TIMEOUT = 45000;

      const $ = (id) => document.getElementById(id);

      const els = {
        lobby: $('lobby'),
        room: $('room'),
        roomLine: document.querySelector('.room-line'),
        themeToggle: document.querySelector('.theme-toggle'),
        createGame: $('createGame'),
        lastRoomLink: $('lastRoomLink'),
        lobbyError: $('lobbyError'),
        roomCode: $('roomCode'),
        leaveRoomPhone: $('leaveRoomPhone'),
        leaveRoomDesktop: $('leaveRoomDesktop'),
        waiting: $('waiting'),
        youSeatName: $('youSeatName'),
        shareLink: $('shareLink'),
        copyLink: $('copyLink'),
        connection: $('connection'),
        connectionText: $('connectionText'),
        game: $('game'),
        chips: $('chips'),
        waitingEdit: $('waitingEdit'),
        nameOverlay: $('nameOverlay'),
        nameForm: $('nameForm'),
        nameInput: $('nameInput'),
        nameButton: $('nameButton'),
        nameCancel: $('nameCancel'),
        main: document.querySelector('main'),
      };

      const clientId = getClientId();

      let roomCode = null;
      let currentState = null;
      let subscriber = null;
      let connectionState = 'connecting';
      let connectionSubscriber = null;

      let playerName = typedName(storageGet(STORAGE_NAME)) || null;
      let connecting = false;
      let connectTimer = null;
      let connectDelay = CONNECT_BACKOFF_START;

      let pushing = false;
      let pushAgain = false;
      let pushTimer = null;
      let pushDelay = POST_BACKOFF_START;
      let postFailing = false;
      let streamConnected = false;

      let nameResolver = null;
      let copyFeedbackTimer = null;

      // ── Storage ──────────────────────────────────────────────────────────

      function storageGet(key) {
        try { return window.localStorage.getItem(key); } catch { return null; }
      }

      function storageSet(key, value) {
        try { window.localStorage.setItem(key, value); } catch { /* unavailable */ }
      }

      function storageRemove(key) {
        try { window.localStorage.removeItem(key); } catch { /* unavailable */ }
      }

      function getClientId() {
        const stored = storageGet(STORAGE_CLIENT_ID);
        if (stored && /^[A-Za-z0-9-]{8,64}$/.test(stored)) return stored;

        let id;
        if (window.crypto && typeof window.crypto.getRandomValues === 'function') {
          const bytes = new Uint8Array(16);
          window.crypto.getRandomValues(bytes);
          id = Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('');
        } else {
          id = `id-${Date.now()}-${Math.random().toString(36).slice(2)}`;
        }
        storageSet(STORAGE_CLIENT_ID, id);
        return id;
      }

      function stateStorageKey(code) {
        return STORAGE_STATE_PREFIX + code;
      }

      function loadLocalState(code) {
        const raw = storageGet(stateStorageKey(code));
        if (!raw) return null;
        try {
          const parsed = JSON.parse(raw);
          return isValidState(parsed) ? parsed : null;
        } catch {
          return null;
        }
      }

      function saveLocalState(state) {
        storageSet(stateStorageKey(roomCode), JSON.stringify(state));
      }

      // ── State helpers ────────────────────────────────────────────────────

      function clone(value) {
        return JSON.parse(JSON.stringify(value));
      }

      function isSeat(value) {
        return value === null || (
          Boolean(value) &&
          typeof value === 'object' &&
          !Array.isArray(value) &&
          typeof value.id === 'string' &&
          value.id.length > 0 &&
          typeof value.name === 'string'
        );
      }

      function isValidState(value) {
        return (
          Boolean(value) &&
          typeof value === 'object' &&
          !Array.isArray(value) &&
          Number.isInteger(value.version) &&
          value.version >= 0 &&
          Array.isArray(value.seats) &&
          value.seats.length === 2 &&
          value.seats.every(isSeat) &&
          (value.starter === 0 || value.starter === 1) &&
          Array.isArray(value.actions) &&
          isLegalGame(value)
        );
      }

      function seatOf(state) {
        if (!state) return null;
        for (let i = 0; i < 2; i++) {
          if (state.seats[i] && state.seats[i].id === clientId) return i;
        }
        return null;
      }

      function defaultName(seat) {
        return seat === 1 ? 'Player 2' : 'Player 1';
      }

      function typedName(raw) {
        return String(raw || '')
          .replace(/\s+/g, ' ')
          .trim()
          .slice(0, MAX_NAME_LENGTH)
          .trim();
      }

      function cleanName(raw, seat) {
        return typedName(raw) || defaultName(seat);
      }

      // ── Gweet ────────────────────────────────────────────────────────────

      function gweetKey() {
        return `${KEY_PREFIX}-${roomCode}`;
      }

      function gweetStreamUrl(query) {
        return `${GWEET_BASE}/stream/${encodeURIComponent(gweetKey())}/${query}`;
      }

      // A cache-busting query parameter avoids browser-cached GET responses
      // without sending non-safelisted headers (which would force a CORS
      // preflight, and Gweet does not answer OPTIONS).
      function cacheBuster() {
        return `_=${Date.now().toString(36)}`;
      }

      async function fetchWithTimeout(url, options = {}, consume = null) {
        const controller = new AbortController();
        const timer = window.setTimeout(() => controller.abort(), REQUEST_TIMEOUT);
        try {
          const res = await fetch(url, { ...options, signal: controller.signal });
          return consume ? await consume(res) : res;
        } finally {
          clearTimeout(timer);
        }
      }

      // A single Gweet message is {"created","name","values":{"state":[json]}}.
      // Some messages (the POST response) wrap that in {"message":...}; accept both.
      function extractStateRaw(message) {
        if (!message || typeof message !== 'object') return null;
        const values = message.values;
        if (values && Array.isArray(values.state) && typeof values.state[0] === 'string') {
          return values.state[0];
        }
        if (message.message) return extractStateRaw(message.message);
        return null;
      }

      async function fetchLatestState() {
        // Read the body inside the timeout: headers can arrive promptly while
        // the body never does.
        const data = await fetchWithTimeout(
          gweetStreamUrl(`?latest=1&${cacheBuster()}`),
          {},
          async (res) => {
            if (!res.ok) throw new Error(`Gweet GET failed with HTTP ${res.status}`);
            return res.json();
          },
        );
        if (!data || !Array.isArray(data.messages)) {
          throw new Error('Unexpected Gweet response');
        }
        if (data.messages.length === 0) return null;

        const raw = extractStateRaw(data.messages[data.messages.length - 1]);
        if (raw === null) throw new Error('Gweet message has no state field');

        let parsed;
        try {
          parsed = JSON.parse(raw);
        } catch {
          throw new Error('Gweet state is not valid JSON');
        }
        if (!isValidState(parsed)) {
          throw new Error('Gweet state has an unexpected shape');
        }
        return parsed;
      }

      function pushStateNow() {
        if (!currentState || !roomCode) return;

        if (pushTimer) {
          clearTimeout(pushTimer);
          pushTimer = null;
        }
        if (pushing) {
          pushAgain = true;
          return;
        }

        pushing = true;
        pushAgain = false;
        const snapshot = currentState;
        const body = new URLSearchParams();
        body.set('state', JSON.stringify(snapshot));

        fetchWithTimeout(gweetStreamUrl(''), { method: 'POST', body })
          .then((res) => {
            if (!res.ok) throw new Error(`Gweet POST failed with HTTP ${res.status}`);
            pushing = false;
            pushDelay = POST_BACKOFF_START;
            if (postFailing) {
              postFailing = false;
              refreshConnection();
            }
            if (pushAgain) pushStateNow();
          })
          .catch((err) => {
            console.warn('Could not post state; will retry.', err);
            pushing = false;
            postFailing = true;
            refreshConnection();
            schedulePushRetry();
          });
      }

      function schedulePushRetry() {
        if (pushTimer || !currentState) return;
        pushTimer = window.setTimeout(() => {
          pushTimer = null;
          pushStateNow();
        }, pushDelay);
        pushDelay = Math.min(pushDelay * 2, POST_BACKOFF_MAX);
      }

      // The connection pill is driven by both the live stream and the POST
      // queue: a failed POST means the move has not reached the server yet,
      // even while the stream is still open.
      function refreshConnection() {
        if (postFailing) {
          setConnection('reconnecting');
        } else if (streamConnected) {
          setConnection('connected');
        }
      }

      // Apply remote-or-local after a successful fetch. Returns true if a state
      // existed, false when this is a brand new room with nothing stored.
      function reconcile(remote) {
        const local = currentState || (roomCode ? loadLocalState(roomCode) : null);

        if (!remote) {
          if (!local) return false;
          if (currentState !== local) setState(local);
          pushStateNow();
          return true;
        }

        if (local && local.version > remote.version) {
          if (currentState !== local) setState(local);
          pushStateNow();
        } else {
          setState(remote);
        }
        return true;
      }

      async function syncFromServer() {
        let remote;
        try {
          remote = await fetchLatestState();
        } catch (err) {
          // A failed fetch is not an empty room: retry rather than create.
          console.warn('Could not fetch room state.', err);
          return false;
        }

        reconcile(remote);

        // Ask only once. The room can change while the prompt is open, so the
        // answer is applied to a fresh fetch, never to the state that opened
        // the prompt.
        if (playerName === null && seatOf(currentState) === null &&
            (!currentState || currentState.seats.indexOf(null) !== -1)) {
          const answer = await askName('first', '');
          if (answer.type === 'cancel') return false;
          playerName = answer.name;

          let latest;
          try {
            latest = await fetchLatestState();
          } catch (err) {
            console.warn('Could not fetch room state after the name prompt.', err);
            return false;
          }

          reconcile(latest);
        }

        settleSeat();
        return true;
      }

      // With a name already given, a free seat or an empty room is enough to
      // (re)try entering the game. Runs after a fetch or a state change, and
      // always against the state in hand at that moment.
      function settleSeat() {
        if (playerName === null) return;
        if (currentState === null) {
          createFreshState(playerName);
          return;
        }
        if (seatOf(currentState) !== null) return;
        const freeSeat = currentState.seats.indexOf(null);
        if (freeSeat !== -1) claimSeat(freeSeat, playerName);
      }

      function createFreshState(rawName) {
        setState({
          version: 1,
          seats: [{ id: clientId, name: cleanName(rawName, 0) }, null],
          starter: 0,
          actions: [],
        });
        pushStateNow();
      }

      function claimSeat(index, rawName) {
        if (!currentState || currentState.seats[index]) return;
        const next = clone(currentState);
        next.seats[index] = { id: clientId, name: cleanName(rawName, index) };
        next.version = currentState.version + 1;
        setState(next);
        pushStateNow();
      }

      function applyRemoteState(incoming) {
        if (!isValidState(incoming)) return false;
        if (currentState && incoming.version < currentState.version) return false;
        setState(incoming);
        return true;
      }

      function handleStreamLine(line) {
        const text = line.trim();
        if (!text) return; // keepalive

        let message;
        try {
          message = JSON.parse(text);
        } catch {
          console.warn('Ignoring malformed message from Gweet stream.');
          return;
        }

        const raw = extractStateRaw(message);
        if (raw === null) return;

        let incoming;
        try {
          incoming = JSON.parse(raw);
        } catch {
          console.warn('Ignoring streamed state that is not valid JSON.');
          return;
        }
        applyRemoteState(incoming);
      }

      async function openStream() {
        const controller = new AbortController();
        let watchdog = null;

        const touch = () => {
          if (watchdog) clearTimeout(watchdog);
          watchdog = window.setTimeout(() => {
            console.warn('Gweet stream went silent; reconnecting.');
            controller.abort();
          }, STREAM_IDLE_TIMEOUT);
        };
        // The watchdog also covers the handshake: a stream request that never
        // returns headers must not block the connect loop.
        touch();

        try {
          // Firefox resolves this fetch only when the first body byte arrives,
          // not when the headers arrive. Gweet sends one keepalive newline as
          // soon as the subscription is registered for this reason. Without it,
          // Firefox waits up to 30 seconds for the first ticker keepalive.
          let response;
          try {
            response = await fetch(gweetStreamUrl(`?streaming=1&${cacheBuster()}`), {
              signal: controller.signal,
            });
          } catch (err) {
            console.warn('Could not open Gweet stream.', err);
            return;
          }

          if (!response.ok || !response.body) {
            console.warn(`Gweet stream failed with HTTP ${response.status}`);
            return;
          }

          connectDelay = CONNECT_BACKOFF_START;
          streamConnected = true;
          refreshConnection();

          try {
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';

            touch();

            // The stream only carries messages posted after we subscribe. Fetch
            // the latest state once more now that the subscription is open, to
            // close the gap between the pre-connect fetch and registration.
            try {
              const latest = await fetchLatestState();
              reconcile(latest);
            } catch (err) {
              console.warn('Post-connect refresh failed; reconnecting to stay in sync.', err);
              try { await reader.cancel(); } catch { /* ignore */ }
              return;
            }

            try {
              while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                touch();
                buffer += decoder.decode(value, { stream: true });
                let newline;
                while ((newline = buffer.indexOf('\n')) !== -1) {
                  const line = buffer.slice(0, newline);
                  buffer = buffer.slice(newline + 1);
                  handleStreamLine(line);
                }
              }
            } catch (err) {
              if (err.name !== 'AbortError') {
                console.warn('Gweet stream closed.', err);
              }
            }
          } finally {
            streamConnected = false;
          }
        } finally {
          if (watchdog) clearTimeout(watchdog);
        }
      }

      async function connect() {
        if (connecting) return;
        connecting = true;

        try {
          if (await syncFromServer()) {
            await openStream();
          }
        } catch (err) {
          console.warn('Connection loop failed.', err);
        } finally {
          connecting = false;
        }

        scheduleReconnect();
      }

      function scheduleReconnect() {
        setConnection('reconnecting');
        if (connectTimer) return;

        const delay = connectDelay;
        connectDelay = Math.min(connectDelay * CONNECT_BACKOFF_FACTOR, CONNECT_BACKOFF_MAX);
        connectTimer = window.setTimeout(() => {
          connectTimer = null;
          connect();
        }, delay);
      }

      // ── Rendering ────────────────────────────────────────────────────────

      function setState(next) {
        currentState = next;
        saveLocalState(next);
        renderRoom();
        if (subscriber) {
          try {
            subscriber(clone(next), seatOf(next));
          } catch (err) {
            console.error('State change callback failed.', err);
          }
        }
        settleSeat();
      }

      function renderRoom() {
        const state = currentState;
        const mySeat = seatOf(state);
        const waiting = Boolean(
          state && mySeat !== null && state.seats[1 - mySeat] === null
        );

        els.waiting.hidden = !waiting;
        els.game.hidden = waiting;
        els.room.dataset.phase = waiting ? 'waiting' : 'game';
        els.waitingEdit.disabled = connectionState !== 'connected';

        if (waiting) els.youSeatName.textContent = state.seats[mySeat].name;
      }

      function setConnection(state) {
        const changed = connectionState !== state;
        connectionState = state;
        els.connectionText.textContent = CONNECTION_LABELS[state];
        els.connection.dataset.state = state;
        els.waitingEdit.disabled = connectionState !== 'connected';
        els.nameButton.disabled = nameMode === 'edit' && connectionState !== 'connected';

        if (changed && connectionSubscriber) {
          try {
            connectionSubscriber(state);
          } catch (err) {
            console.error('Connection change callback failed.', err);
          }
        }
      }

      function shareUrl(code) {
        const url = new URL(window.location.href);
        url.search = '';
        url.hash = '';
        url.searchParams.set('room', code);
        return url.href;
      }

      function renderShare() {
        els.roomCode.textContent = roomCode;
        els.shareLink.value = shareUrl(roomCode);
        document.title = `Quarto \u2014 ${roomCode}`;
      }

      // ── Name prompt ──────────────────────────────────────────────────────

      let nameMode = 'first';

      function askName(mode, initial) {
        return new Promise((resolve) => {
          nameResolver = resolve;
          nameMode = mode;
          els.nameButton.disabled = mode === 'edit' && connectionState !== 'connected';
          els.nameCancel.hidden = mode !== 'edit';
          els.nameInput.value = initial || '';
          els.main.inert = true;
          els.nameOverlay.hidden = false;
          window.setTimeout(() => els.nameInput.focus(), 0);
        });
      }

      function closeNameOverlay() {
        els.nameInput.blur();
        els.nameOverlay.hidden = true;
        els.main.inert = false;
      }

      function onSubmitName(event) {
        event.preventDefault();
        if (!nameResolver) return;

        const resolve = nameResolver;
        nameResolver = null;
        // The seat is only known after the post-prompt fetch, so keep the raw
        // input and let the seat-specific default be applied when it is used.
        const name = els.nameInput.value;
        const typed = typedName(name);
        if (typed) storageSet(STORAGE_NAME, typed);
        else storageRemove(STORAGE_NAME);
        closeNameOverlay();
        resolve({ type: 'submit', name });
      }

      function cancelName() {
        if (!nameResolver || nameMode !== 'edit') return;

        const resolve = nameResolver;
        nameResolver = null;
        closeNameOverlay();
        resolve({ type: 'cancel' });
      }

      async function editOwnName() {
        if (connectionState !== 'connected') return;
        if (!currentState) return;
        const seat = seatOf(currentState);
        if (seat === null) return;

        const current = currentState.seats[seat] ? currentState.seats[seat].name : '';
        const answer = await askName('edit', current);
        if (answer.type === 'submit' && renameOwnSeat(answer.name)) {
          playerName = answer.name;
        }
        focusEditControl();
      }

      function focusEditControl() {
        window.setTimeout(() => {
          const target = els.waiting.hidden
            ? document.querySelector('.chip-edit')
            : els.waitingEdit;
          if (target && !target.disabled) target.focus();
        }, 50);
      }

      function renameOwnSeat(rawName) {
        if (connectionState !== 'connected') return false;
        if (!currentState) return false;
        const seat = seatOf(currentState);
        if (seat === null) return false;

        const next = clone(currentState);
        next.seats[seat] = {
          ...next.seats[seat],
          name: cleanName(rawName, seat),
        };
        next.version = currentState.version + 1;
        setState(next);
        pushStateNow();
        return true;
      }

      // ── Clipboard ────────────────────────────────────────────────────────

      async function copyShareLink() {
        let copied = false;
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(els.shareLink.value);
            copied = true;
          }
        } catch { /* fall through */ }

        if (!copied) {
          els.shareLink.focus();
          els.shareLink.select();
          try {
            copied = document.execCommand('copy');
          } catch {
            copied = false;
          }
        }

        flashCopyLabel(copied ? 'Copied!' : 'Copy failed');
        if (!copied) els.shareLink.select();
      }

      function flashCopyLabel(label) {
        if (copyFeedbackTimer) clearTimeout(copyFeedbackTimer);
        els.copyLink.textContent = label;
        copyFeedbackTimer = window.setTimeout(() => {
          copyFeedbackTimer = null;
          els.copyLink.textContent = 'Copy link';
        }, 1600);
      }

      // ── Lobby / room setup ───────────────────────────────────────────────

      function newRoomCode() {
        let code = '';
        const limit = 256 - (256 % ROOM_ALPHABET.length);
        const bytes = new Uint8Array(ROOM_LENGTH);

        while (code.length < ROOM_LENGTH) {
          window.crypto.getRandomValues(bytes);
          for (const byte of bytes) {
            if (byte >= limit) continue;
            code += ROOM_ALPHABET[byte % ROOM_ALPHABET.length];
            if (code.length === ROOM_LENGTH) break;
          }
        }
        return code;
      }

      function normalizeRoomCode(raw) {
        if (typeof raw !== 'string') return null;
        const code = raw.trim().toUpperCase();
        return /^[A-Z0-9]{1,64}$/.test(code) ? code : null;
      }

      function showLobby(message) {
        els.lobby.hidden = false;
        els.room.hidden = true;
        els.lobby.prepend(els.themeToggle);
        els.nameOverlay.hidden = true;
        els.lobbyError.hidden = !message;
        els.lobbyError.textContent = message || '';
        document.title = 'Quarto';

        const last = normalizeRoomCode(storageGet(STORAGE_LAST_ROOM));
        if (last) {
          els.lastRoomLink.hidden = false;
          els.lastRoomLink.textContent = `Rejoin last room (${last})`;
          els.lastRoomLink.href = '?room=' + encodeURIComponent(last);
        } else {
          els.lastRoomLink.hidden = true;
        }
      }

      function startRoom(code) {
        roomCode = code;
        storageSet(STORAGE_LAST_ROOM, code);

        els.lobby.hidden = true;
        els.room.hidden = false;
        els.roomLine.append(els.themeToggle);
        els.nameOverlay.hidden = true;
        els.lobbyError.hidden = true;
        renderShare();
        renderRoom();
        setConnection('connecting');
        connect();
      }

      // ── Boot ─────────────────────────────────────────────────────────────

      window.QuartoOnline = Object.freeze({
        getState() {
          return currentState ? clone(currentState) : null;
        },

        getSeat() {
          return seatOf(currentState);
        },

        getConnection() {
          return connectionState;
        },

        rename(name) {
          return renameOwnSeat(name);
        },

        onConnectionChange(callback) {
          if (typeof callback !== 'function') {
            throw new TypeError('onConnectionChange() expects a function');
          }
          connectionSubscriber = callback;
          try {
            callback(connectionState);
          } catch (err) {
            console.error('Connection change callback failed.', err);
          }
          return () => {
            if (connectionSubscriber === callback) connectionSubscriber = null;
          };
        },

        submit(next) {
          if (!currentState || seatOf(currentState) === null) return false;
          if (!next || typeof next !== 'object') {
            throw new TypeError('submit() expects a state object');
          }
          if (next.starter !== 0 && next.starter !== 1) {
            throw new TypeError('state.starter must be 0 or 1');
          }
          if (!Array.isArray(next.actions)) {
            throw new TypeError('state.actions must be an array');
          }

          let actions;
          try {
            actions = clone(next.actions);
          } catch {
            throw new TypeError('state.actions must be JSON-serializable');
          }

          // version and seats belong to the online layer, not to the caller.
          setState({
            version: currentState.version + 1,
            seats: clone(currentState.seats),
            starter: next.starter,
            actions,
          });
          pushStateNow();
          return true;
        },

        onStateChange(callback) {
          if (typeof callback !== 'function') {
            throw new TypeError('onStateChange() expects a function');
          }
          subscriber = callback;
          if (currentState) {
            try {
              callback(clone(currentState), seatOf(currentState));
            } catch (err) {
              console.error('State change callback failed.', err);
            }
          }
          return () => {
            if (subscriber === callback) subscriber = null;
          };
        },
      });

      els.createGame.addEventListener('click', () => {
        window.location.search = '?room=' + encodeURIComponent(newRoomCode());
      });
      els.copyLink.addEventListener('click', copyShareLink);
      els.nameForm.addEventListener('submit', onSubmitName);
      els.nameCancel.addEventListener('click', cancelName);
      document.addEventListener('keydown', (event) => {
        if (event.key !== 'Escape' || els.nameOverlay.hidden) return;
        if (nameMode !== 'edit' || !nameResolver) return;
        event.preventDefault();
        cancelName();
      });
      for (const button of document.querySelectorAll('.name-edit')) {
        button.addEventListener('click', editOwnName);
      }
      els.chips.addEventListener('click', (event) => {
        if (event.target.closest('.chip-edit')) editOwnName();
      });
      els.leaveRoomPhone.href = window.location.pathname;
      els.leaveRoomDesktop.href = window.location.pathname;

      const params = new URLSearchParams(window.location.search);
      const rawRoom = params.get('room');

      if (rawRoom === null) {
        showLobby();
      } else {
        const code = normalizeRoomCode(rawRoom);
        if (code) {
          startRoom(code);
        } else {
          showLobby('That room link is not valid.');
        }

    })();
  </script>

    <script type="module">
    import { ATTRIBUTES, viewOf, applyAction, undo } from './game.js';

    (() => {
      'use strict';

      const $ = (id) => document.getElementById(id);

      const els = {
        game: $('game'),
        chips: $('chips'),
        status: $('gameStatus'),
        statusLabel: $('statusLabel'),
        statusText: $('statusText'),

        favicon: document.querySelector('link[rel="icon"]'),

      // The bit layout lives in game.js. Look attributes up by name rather
      // than repeating their masks here.
      const ATTRIBUTE = Object.fromEntries(
        ATTRIBUTES.map((attribute) => [attribute.name, attribute]),
      );
      const HEIGHT = ATTRIBUTE.height;
      const COLOUR = ATTRIBUTE.colour;
      const SHAPE = ATTRIBUTE.shape;
      const FILL = ATTRIBUTE.fill;

      const CONNECTION_LOST_NOTICE_MS = 5000;
      const FAVICON_DEFAULT = 'favicon.svg';
      const FAVICON_TURN = 'favicon-turn.svg';
      const PENCIL_SVG = '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11.2 2.3a1.2 1.2 0 0 1 1.7 0l.8.8a1.2 1.2 0 0 1 0 1.7L5.4 13.1l-3 .8.8-3z"></path><path d="M9.8 3.7l2.5 2.5"></path></svg>';

      let latestState = null;
      let latestSeat = null;
      let connection = 'connecting';
      let disconnectedAt = null;
      let connectionLostLong = false;
      let lostTimer = null;

      function hasAttribute(piece, attribute) {
        return (piece & attribute.mask) !== 0;
      }

      function valueOf(piece, attribute) {
        return attribute.values[hasAttribute(piece, attribute) ? 1 : 0];
      }

      function pieceLabel(piece) {
        const values = ATTRIBUTES.map((attribute) => valueOf(piece, attribute));
        const first = values[0].charAt(0).toUpperCase() + values[0].slice(1);
        return `${[first, ...values.slice(1)].join(', ')} piece`;
      }

      // Every piece is the same construction seen from above and a little
      // from the front: a footprint shadow, the side wall, the 56-unit top
      // face, and (when hollow) a 28-unit recess. Height sets the wall and
      // shadow, colour sets the timber, shape sets the outline, fill sets
      // whether the centre is recessed.
      function pieceSVG(piece, size) {
        const tall = hasAttribute(piece, HEIGHT);
        const light = hasAttribute(piece, COLOUR);
        const round = hasAttribute(piece, SHAPE);
        const solid = hasAttribute(piece, FILL);

        const topY = tall ? 36 : 46;
        const wall = tall ? 28 : 8;
        const shadowDy = tall ? 6 : 3;
        const baseY = topY + wall;

        const face = light ? 'var(--light-face)' : 'var(--dark-face)';
        const wallFill = light ? 'var(--light-wall)' : 'var(--dark-wall)';
        const recess = light ? 'var(--light-recess)' : 'var(--dark-recess)';
        const outline = light ? 'var(--light-outline)' : 'var(--dark-outline)';
        const recessOutline = light ? 'var(--light-outline)' : 'var(--dark-lip)';
        const shadow = 'fill="#2B1E12" fill-opacity="0.22"';

        const shape = [];
        if (round) {
          shape.push(`<circle cx="50" cy="${baseY + shadowDy}" r="28" ${shadow}/>`);
          shape.push(
            `<path d="M22 ${topY} V${baseY} A28 28 0 0 0 78 ${baseY} V${topY} Z" fill="${wallFill}" stroke="${outline}" stroke-width="2" stroke-linejoin="round"/>`,
          );
          shape.push(`<circle cx="50" cy="${topY}" r="28" fill="${face}" stroke="${outline}" stroke-width="2"/>`);
          if (!solid) {
            shape.push(`<circle cx="50" cy="${topY}" r="14" fill="${recess}" stroke="${recessOutline}" stroke-width="2"/>`);
          }
        } else {
          shape.push(
            `<rect x="22" y="${baseY - 28 + shadowDy}" width="56" height="56" rx="6" ${shadow}/>`,
          );
          shape.push(
            `<rect x="22" y="${topY - 28}" width="56" height="${56 + wall}" rx="6" fill="${wallFill}" stroke="${outline}" stroke-width="2"/>`,
          );
          shape.push(
            `<rect x="22" y="${topY - 28}" width="56" height="56" rx="6" fill="${face}" stroke="${outline}" stroke-width="2"/>`,
          );
          if (!solid) {

              `<rect x="36" y="${topY - 14}" width="28" height="28" rx="3" fill="${recess}" stroke="${recessOutline}" stroke-width="2"/>`,

      function pieceNode(piece, size) {

      // The lobby's four-piece mark: tall light round solid, tall dark square

        .map((piece) => pieceSVG(piece, 72))

      // Rows: light round, light square, dark round, dark square.
      // Columns: tall solid, tall hollow, short solid, short hollow.
      function buildPoolOrder() {
        const bit = (name, high) => (high ? ATTRIBUTE[name].mask : 0);
        const order = [];
        for (const colour of [1, 0]) {
          for (const shape of [1, 0]) {
            for (const height of [1, 0]) {
              for (const fill of [1, 0]) {

                  bit('height', height) |
                  bit('colour', colour) |
                  bit('shape', shape) |
                  bit('fill', fill),

      const POOL_ORDER = buildPoolOrder();

      function bothSeatsTaken(state) {

      function commonValues(result) {
        const seen = new Set();
        const values = [];

          for (const { value } of line.attributes) {

            values.push(value);

      function statusContent(state, seat, view) {
        if (view.result !== null) {
          if (view.result.type === 'win') {

            const winner = view.result.winner;
            const text = winner === seat
              ? `You win with four ${values} pieces in a line.`
              : `${nameOf(state, winner)} wins with four ${values} pieces in a line.`;
            return { label: 'Quarto!', text, tone: 'is-win' };

          return {
            label: 'Draw',
            text: 'The board is full and there is no Quarto.',
            tone: 'is-neutral',
          };

        const actor = view.seat;
        const other = 1 - actor;

        if (seat === null) {
          if (view.step === 'select') {
            return {
              label: 'You are a spectator',
              text: `${nameOf(state, actor)} selects a piece for ${nameOf(state, other)}.`,
              tone: 'is-neutral',
            };
          }
          if (view.step === 'place') {
            return {
              label: 'You are a spectator',
              text: `${nameOf(state, actor)} places the piece that ${nameOf(state, other)} selected.`,
              tone: 'is-neutral',
            };
          }
          if (view.step === 'pass') {
            return {
              label: 'You are a spectator',
              text: `All the pieces are on the board. ${nameOf(state, actor)} can call Quarto or pass.`,
              tone: 'is-neutral',
            };
          }
          return {
            label: 'You are a spectator',
            text: `${nameOf(state, other)} passed. ${nameOf(state, actor)} can call Quarto or accept a draw.`,
            tone: 'is-neutral',
          };
        }

        if (actor === seat) {
          if (view.step === 'select') {
            return {
              label: 'Your turn',
              text: `Select a piece for ${nameOf(state, other)}.`,
              tone: 'is-own',
            };
          }
          if (view.step === 'place') {
            return {
              label: 'Your turn',
              text: `Place the piece that ${nameOf(state, other)} selected for you.`,
              tone: 'is-own',
            };
          }
          if (view.step === 'pass') {
            return {
              label: 'Your turn',
              text: 'All the pieces are on the board. Call Quarto or pass.',
              tone: 'is-own',
            };
          }
          return {
            label: 'Your turn',
            text: `${nameOf(state, other)} passed. Call Quarto or accept a draw.`,
            tone: 'is-own',
          };
        }

        if (view.step === 'select') {
          return {
            label: "Opponent's turn",
            text: `${nameOf(state, actor)} selects a piece for you.`,
            tone: 'is-opponent',
          };
        }
        if (view.step === 'place') {
          return {
            label: "Opponent's turn",
            text: `${nameOf(state, actor)} places the piece that you selected.`,
            tone: 'is-opponent',
          };
        }
        if (view.step === 'pass') {
          return {
            label: "Opponent's turn",
            text: `All the pieces are on the board. ${nameOf(state, actor)} can call Quarto or pass.`,
            tone: 'is-opponent',
          };
        }
        return {
          label: "Opponent's turn",
          text: `You passed. ${nameOf(state, actor)} can call Quarto or accept a draw.`,
          tone: 'is-opponent',

      function setDisabled(element, disabled) {
        element.disabled = disabled;
      }

      let chipsSeat;

      // The own chip is the name control, so its DOM is only rebuilt when the
      // seat changes. Rebuilding on every state update would drop focus.
      function buildChips(seat) {
        const fragment = document.createDocumentFragment();

        for (let i = 0; i < 2; i++) {
          const own = seat === i;
          const chip = document.createElement(own ? 'button' : 'div');
          chip.className = 'chip';
          chip.id = `chip${i}`;

          dot.setAttribute('aria-hidden', 'true');

          name.className = 'chip-name';
          name.id = `chipName${i}`;
          chip.appendChild(name);

          if (own) {
            const you = document.createElement('span');
            you.className = 'chip-you';
            you.id = `chipYou${i}`;

      function renderChips(state, seat, view) {
        const lost = connection !== 'connected' && connectionLostLong;
        let activeSeat = null;
        if (!lost) {
          if (view.result === null) activeSeat = view.seat;
          else if (view.result.type === 'win') activeSeat = view.result.winner;
        }

        if (chipsSeat !== seat) {

        for (let i = 0; i < 2; i++) {

      function showNotice(kind, text) {

      function renderBoard(state, view, seat) {
        const connected = connection === 'connected';
        const placeable = connected && seat !== null && view.result === null &&
          view.step === 'place' && view.seat === seat;
        const winning = new Set();
        if (view.result !== null && view.result.type === 'win') {
          for (const line of view.result.lines) {

              pieceElement.classList.add('is-faded');
            }
