            if (square === view.lastPlaced &&
                !(view.result !== null && view.result.type === 'draw')) {
              const dot = document.createElement('span');
              dot.className = 'recent-dot';
              dot.setAttribute('role', 'img');
              dot.setAttribute('aria-label', 'Most recently placed piece');
              cell.appendChild(dot);
            }
          }

          fragment.appendChild(cell);
        }

        els.board.replaceChildren(fragment);
      }

      function renderPool(state, view, seat) {
        const remaining = new Set(view.remaining);
        const connected = connection === 'connected';
        const selectable = connected && seat !== null && view.result === null &&
          view.step === 'select' && view.seat === seat;
        const dim = !connected ||
          (seat !== null && view.result === null && view.seat !== seat);

        els.pool.classList.toggle('is-dim', dim);
        els.pool.classList.toggle(
          'is-active',
          selectable && view.wrongClaim === null,
        );

        const fragment = document.createDocumentFragment();
        for (const piece of POOL_ORDER) {
          if (!remaining.has(piece)) {
            const slot = document.createElement('div');
            slot.className = 'pool-slot';
            const dot = document.createElement('span');
            dot.className = 'pool-empty-dot';
            dot.setAttribute('aria-hidden', 'true');
            slot.appendChild(dot);
            fragment.appendChild(slot);
            continue;
          }

          const slot = document.createElement(selectable ? 'button' : 'div');
          slot.className = 'pool-slot';
          if (selectable) {
            slot.type = 'button';
            slot.classList.add('is-selectable');
            slot.setAttribute(
              'aria-label',
              `Select the ${pieceLabel(piece).toLowerCase()}`,
            );
            slot.addEventListener('click', () => submitAction({ type: 'select', piece }));
          }
          slot.appendChild(pieceNode(piece));
          fragment.appendChild(slot);
        }
        els.pool.replaceChildren(fragment);
      }

      function renderHand(state, view) {
        els.hand.replaceChildren();
        if (view.hand === null) {
          const dot = document.createElement('span');
          dot.className = 'hand-empty-dot';
          dot.setAttribute('aria-hidden', 'true');
          els.hand.appendChild(dot);
        } else {
          els.hand.appendChild(pieceNode(view.hand));
        }
        els.hand.classList.toggle(
          'is-paused',
          connectionLostLong && connection !== 'connected',
        );
      }

      function renderControls(state, seat, view) {
        if (!state) {
          els.quartoBlock.hidden = false;
          els.bottomControls.hidden = false;
          els.claim.hidden = false;
          els.pass.hidden = true;
          els.draw.hidden = true;
          els.controlSpacer.hidden = false;
          setDisabled(els.claim, true);
          els.undo.hidden = false;
          setDisabled(els.undo, true);
          els.newGame.hidden = false;
          els.newGame.className = 'button-quiet';
          setDisabled(els.newGame, true);
          return;
        }

        if (seat === null) {
          els.quartoBlock.hidden = true;
          els.bottomControls.hidden = true;
          return;
        }

        els.quartoBlock.hidden = false;
        els.bottomControls.hidden = false;

        const connected = connection === 'connected';
        const playing = view.result === null;
        const myTurn = playing && view.seat === seat;
        const hasPiece = view.board.some((piece) => piece !== null);
        const lastAction = state.actions[state.actions.length - 1];

        els.claim.hidden = false;
        setDisabled(els.claim, !(connected && myTurn && hasPiece));

        const canPass = playing && view.step === 'pass' && view.seat === seat;
        const canDraw = playing && view.step === 'draw' && view.seat === seat;
        els.pass.hidden = !canPass;
        els.draw.hidden = !canDraw;
        setDisabled(els.pass, !connected);
        setDisabled(els.draw, !connected);
        els.controlSpacer.hidden = canPass || canDraw;

        els.undo.hidden = !playing;
        setDisabled(
          els.undo,
          !(connected && playing && lastAction && lastAction.seat === seat),
        );

        els.newGame.hidden = false;
        els.newGame.className = playing ? 'button-quiet' : 'button-strong';
        setDisabled(els.newGame, !connected);
      }

      function renderBoardSkeleton() {
        els.board.classList.remove('is-target', 'is-paused');
        const fragment = document.createDocumentFragment();
        for (let square = 0; square < 16; square++) {
          const cell = document.createElement('div');
          cell.className = 'square';
          fragment.appendChild(cell);
        }
        els.board.replaceChildren(fragment);
      }

      function renderPoolSkeleton() {
        els.pool.classList.remove('is-dim', 'is-active');
        const fragment = document.createDocumentFragment();
        for (let i = 0; i < 16; i++) {
          const slot = document.createElement('div');
          slot.className = 'pool-slot';
          const dot = document.createElement('span');
          dot.className = 'pool-empty-dot';
          dot.setAttribute('aria-hidden', 'true');
          slot.appendChild(dot);
          fragment.appendChild(slot);
        }
        els.pool.replaceChildren(fragment);
      }

      function renderHandSkeleton() {
        els.hand.classList.remove('is-paused');
        els.hand.replaceChildren();
        const dot = document.createElement('span');
        dot.className = 'hand-empty-dot';
        dot.setAttribute('aria-hidden', 'true');
        els.hand.appendChild(dot);
      }

      function renderSkeleton() {
        const lost = connection !== 'connected' && connectionLostLong;

        els.game.classList.add('is-skeleton');
        els.status.removeAttribute('aria-busy');
        els.status.hidden = false;
        els.notice.hidden = true;
        els.status.setAttribute('aria-busy', 'true');

        if (lost) showNotice('connection', 'Connection lost. The game is paused.');

        renderBoardSkeleton();
        renderPoolSkeleton();
        renderHandSkeleton();
        els.board.classList.toggle('is-paused', lost);
        els.hand.classList.toggle('is-paused', lost);
        renderControls(null, null, null);
      }

      function renderFavicon(view) {
        const yourTurn = Boolean(
          view &&
          view.result === null &&
          latestSeat !== null &&
          bothSeatsTaken(latestState) &&
          view.seat === latestSeat
        );
        const href = yourTurn ? FAVICON_TURN : FAVICON_DEFAULT;
        if (els.favicon.getAttribute('href') !== href) {
          els.favicon.setAttribute('href', href);
        }
      }

      let lastRenderKey = null;

      function render() {
        const notice = connection !== 'connected' && connectionLostLong;
        // The full content, not the version: when the two players act at the
        // same moment, two different states carry the same version, and the
        // one that arrives last must replace the other on the screen.
        const stateKey = latestState ? JSON.stringify(latestState) : 'none';
        const key = `${stateKey}|${latestSeat}|${connection}|${notice}`;
        if (key === lastRenderKey) return;
        lastRenderKey = key;

        if (!latestState) {
          renderSkeleton();
          renderFavicon(null);
          return;
        }

        els.game.classList.remove('is-skeleton');
        const view = viewOf(latestState);
        renderChips(latestState, latestSeat, view);
        renderStatus(latestState, latestSeat, view);
        renderBoard(latestState, view, latestSeat);
        renderPool(latestState, view, latestSeat);
        renderHand(latestState, view);
        renderControls(latestState, latestSeat, view);
        renderFavicon(view);
      }

      function submitAction(action) {
        if (connection !== 'connected') return;
        if (!latestState || latestSeat === null) return;
        const outcome = applyAction(latestState, { ...action, seat: latestSeat });
        if (!outcome.ok) {
          console.warn('Rejected action:', outcome.error);
          return;
        }
        window.QuartoOnline.submit(outcome.game);
      }

      function undoLastAction() {
        if (connection !== 'connected') return;
        if (!latestState || latestSeat === null) return;
        const outcome = undo(latestState, latestSeat);
        if (!outcome.ok) {
          console.warn('Could not undo:', outcome.error);
          return;
        }
        window.QuartoOnline.submit(outcome.game);
      }

      function startNewGame() {
        if (connection !== 'connected') return;
        if (!latestState || latestSeat === null) return;
        const view = viewOf(latestState);
        if (view.result === null &&
            !window.confirm('End this game and start a new one?')) {
          return;
        }
        window.QuartoOnline.submit({
          starter: 1 - latestState.starter,
          actions: [],
        });
      }

      function handleConnection(next) {
        const now = Date.now();
        connection = next;

        if (next === 'connected') {
          disconnectedAt = null;
          connectionLostLong = false;
          if (lostTimer) {
            clearTimeout(lostTimer);
            lostTimer = null;
          }
        } else {
          if (disconnectedAt === null) disconnectedAt = now;
          if (!connectionLostLong && !lostTimer) {
            const remaining = Math.max(
              0,
              CONNECTION_LOST_NOTICE_MS - (now - disconnectedAt),
            );
            lostTimer = window.setTimeout(() => {
              lostTimer = null;
              if (connection === 'connected') return;
              connectionLostLong = true;
              render();
            }, remaining);
          }
        }

        render();
      }

      els.claim.addEventListener('click', () => submitAction({ type: 'claim' }));
      els.pass.addEventListener('click', () => submitAction({ type: 'pass' }));
      els.draw.addEventListener('click', () => submitAction({ type: 'draw' }));
      els.undo.addEventListener('click', undoLastAction);
      els.newGame.addEventListener('click', startNewGame);

      latestState = window.QuartoOnline.getState();
      latestSeat = window.QuartoOnline.getSeat();
      connection = window.QuartoOnline.getConnection();

      window.QuartoOnline.onStateChange((state, seat) => {
        latestState = state;
        latestSeat = seat;
        render();
      });

      window.QuartoOnline.onConnectionChange(handleConnection);

      render();
    })();
  </script>
</body>
</html>
